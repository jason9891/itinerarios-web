<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1d30">
  <title>Cerro Verde · Itinerarios · RACIEMSA</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="prueba17.css?v=detalles-1">
  <link rel="stylesheet" href="cerro-verde.css?v=detalles-4">
  <link rel="stylesheet" href="cerro-verde-tracking.css?v=seguimiento-hoy-04">
</head>
<body class="auth-pending" data-itinerary="cerro-verde">

<!-- SHELL CANÓNICO: idéntico al de Cemento y futuros itinerarios.
     Logo y marca se controlan desde shared/platform-shell.js -->
<header class="top">
  <div class="logo" id="platform-logo">R</div>
  <div class="brand">
    <b id="platform-brand">RACIEMSA</b>
    <small id="platform-subtitle">CERRO VERDE</small>
  </div>
  <div class="grow"></div>
  <a class="itinerary-link" href="index.html">VOLVER A ITINERARIOS</a>
</header>

<main id="login" class="login">
  <div class="login-icon">▰</div>
  <p class="eyebrow">PLATAFORMA DE SEGUIMIENTO</p>
  <h1>Cerro Verde</h1>
  <p>Usa la misma cuenta autorizada de la plataforma.</p>
  <div class="login-form">
    <label><span>USUARIO</span><input id="login-user" type="text" autocomplete="username" placeholder="PRUEBA" autocapitalize="characters"></label>
    <label><span>CONTRASEÑA</span><input id="login-password" type="password" autocomplete="current-password" placeholder="••••••••"></label>
    <button id="user-login" class="primary">INGRESAR</button>
  </div>
  <div class="login-separator"><span>o</span></div>
  <button id="google-login" class="ghost login-google">CONTINUAR CON GOOGLE</button>
  <p id="login-message" class="message"></p>
</main>

<div id="workspace" class="workspace hidden">
  <aside>
    <div class="side-title">
      <span>CERRO VERDE</span>
      <b>Control operativo</b>
    </div>
    <nav>
      <button data-route="home"><i>⌂</i><span>INICIO<small>RESUMEN Y CORTE</small></span></button>
      <button data-route="sap"><i>⇧</i><span>ACTUALIZAR SAP<small>EXCEL · TEMPORAL</small></span></button>
      <button data-route="precarga"><i>↻</i><span>PRECARGAR RUTAS<small>GPS · DOBLE INTENTO</small></span></button>
      <button data-route="seguimiento"><i>▰</i><span>SEGUIMIENTO<small>GPS PROPONE</small></span></button>
      <button data-route="grupo"><i>◎</i><span>GRUPO SMCV<small>ALTAS / BAJAS</small></span></button>
      <button data-route="paradas"><i>◉</i><span>PARADAS<small>PERNOCTES Y PAUSAS</small></span></button>
      <button data-route="archivos"><i>▣</i><span>ARCHIVOS<small>BAJO DEMANDA</small></span></button>
      <button data-route="reporte"><i>▥</i><span>CREAR REPORTE<small>CAL VACÍO/CARGADO</small></span></button>
    </nav>
    <div class="side-foot">
      <b>ÁREA SATELITAL</b>
      <small>PRUEBA INTEGRAL 02 · MAPA PERSISTENTE</small>
    </div>
  </aside>
  <main id="content" class="content"></main>
</div>

<script src="vendor/jszip.min.js"></script>
<script type="module" src="cerro-verde/main.js?v=modular-08-mapfix"></script>
</body>
</html>
