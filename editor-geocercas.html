<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071525"><title>Editor de geocercas · RACIEMSA</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="editor-geocercas.css?v=editor-ux-02"></head><body class="geo-body auth-pending">
<header class="top"><div class="logo geo-logo">◎</div><div><b>EDITOR DE GEOCERCAS</b><small>MAESTRO CARTOGRÁFICO</small></div><div class="grow"></div><a class="itinerary-link" href="index.html">VOLVER A ITINERARIOS</a></header>
<main id="login" class="login"><p class="eyebrow">HERRAMIENTA MAESTRA</p><h1>Editor de geocercas</h1><p>Disponible para todos los usuarios activos de la plataforma.</p><button id="google-login" class="primary">CONTINUAR CON GOOGLE</button><p id="login-message" class="message"></p></main>
<main id="editor" class="geo-workspace hidden">
<aside class="geo-sidebar">
  <section class="gs-block">
    <span class="gs-label">VISTA DE TRABAJO</span>
    <div id="scope-tabs" class="gs-scope" role="tablist"></div>
    <div id="scope-summary" class="gs-summary"></div>
  </section>
  <section class="gs-block">
    <div class="gs-types" id="type-tabs">
      <button data-type="geocercas" class="active">Geocercas</button>
      <button data-type="rutas_madre">Rutas madre</button>
      <button data-type="geocerca_tramo">Geocercas de ruta</button>
    </div>
    <input id="object-search" type="search" placeholder="Buscar por nombre o ID…" class="gs-search" autocomplete="off">
    <div id="filter-chips" class="gs-chips"></div>
    <div class="gs-tools">
      <button id="show-all" title="Mostrar en el mapa todo lo listado">Ver todo</button>
      <button id="hide-all" title="Ocultar todo del mapa">Ocultar</button>
      <button id="bulk-on" class="hidden" title="Asignar al itinerario lo listado">Asignar listadas</button>
      <button id="bulk-off" class="hidden" title="Quitar del itinerario lo listado (las protegidas se conservan)">Quitar listadas</button>
    </div>
  </section>
  <div id="object-tree" class="gs-tree"></div>
  <button id="new-object" class="gs-new">＋ Nueva geocerca</button>
</aside>
<section class="geo-main">
  <div class="gc-bar">
    <div id="project-state" class="gc-state">SIN CARGAR</div>
    <div class="gc-steps">
      <button id="save-draft" class="gc-step"><i>1</i>Guardar</button>
      <button id="validate-draft" class="gc-step"><i>2</i>Validar</button>
      <button id="publish" class="gc-step gc-publish"><i>3</i><span id="publish-label">Publicar</span></button>
    </div>
    <button id="discard" class="gc-ghost" title="Volver a la última versión guardada">Descartar cambios</button>
  </div>
  <div class="geo-map-wrap">
    <div id="geo-map"></div>
    <div id="draw-bar" class="draw-bar hidden">
      <b id="draw-title">Dibujando</b>
      <span id="draw-count">0 puntos</span>
      <button id="draw-undo">Deshacer punto</button>
      <button id="draw-cancel">Cancelar</button>
      <button id="finish-draw" class="ok">Terminar</button>
      <small>Clic en el mapa para agregar puntos · Enter termina · Esc cancela</small>
    </div>
    <div id="geo-toasts" class="toasts" aria-live="polite"></div>
  </div>
</section>
<aside class="geo-properties" id="props"></aside>
</main>
<div id="geo-modal" class="gm hidden"><div class="gm-card" role="dialog" aria-modal="true"><h3 id="gm-title"></h3><div id="gm-body"></div><div class="gm-actions"><button id="gm-cancel" class="gm-ghost">Cancelar</button><button id="gm-ok" class="gm-ok">Aceptar</button></div></div></div>
<script type="module" src="editor-geocercas.js?v=editor-ux-02"></script></body></html>
