<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1d30">
  <title>Check list de seguimiento · Itinerarios · RACIEMSA</title>
  <link rel="stylesheet" href="checklist/base.css?v=ck1">
  <link rel="stylesheet" href="checklist/checklist.css?v=ck1">
</head>
<body class="auth-pending" data-itinerary="checklist">

<!-- SHELL CANÓNICO (ver docs/CONVENCIONES_SHELL_Y_CLOCATOR.md). Logo y marca: abarrotes/propio/platform-shell.js -->
<header class="top">
  <div class="logo" id="platform-logo">R</div>
  <div class="brand">
    <b id="platform-brand">RACIEMSA</b>
    <small id="platform-subtitle">CHECK LIST DE SEGUIMIENTO</small>
  </div>
  <div class="grow"></div>
  <small id="chk-user" title="Usuario activo en la sesión" style="margin-right:14px;opacity:.85;font-weight:600"></small>
  <a class="itinerary-link" href="index.html">VOLVER A ITINERARIOS</a>
</header>

<main id="login" class="login">
  <div class="login-icon">▰</div>
  <p class="eyebrow">PLATAFORMA DE SEGUIMIENTO</p>
  <h1>CHECK LIST DE SEGUIMIENTO</h1>
  <p>Quién, cuándo y dónde se quedó el seguimiento. Usa la misma cuenta autorizada de la plataforma.</p>
  <div class="login-form">
    <label><span>USUARIO</span><input id="login-user" type="text" autocomplete="username" placeholder="PRUEBA" autocapitalize="characters"></label>
    <label><span>CONTRASEÑA</span><input id="login-password" type="password" autocomplete="current-password" placeholder="••••••••"></label>
    <button id="user-login" class="primary">INGRESAR</button>
  </div>
  <div class="login-separator"><span>o</span></div>
  <button id="google-login" class="ghost login-google">CONTINUAR CON GOOGLE</button>
  <p id="login-message" class="message"></p>
</main>

<div id="workspace" class="workspace hidden" style="display:block">
  <main id="content" class="content" style="max-width:1100px;margin:0 auto"></main>
</div>

<script type="module" src="checklist/main.js?v=ck1"></script>
</body>
</html>
